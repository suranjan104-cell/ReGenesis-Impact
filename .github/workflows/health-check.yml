name: Nightly health check

# Runs every night — tests the codebase headlessly AND probes the live
# site. Any failure auto-creates a GitHub issue labeled `auto-improve`,
# which the Claude auto-fix workflow picks up.

on:
  schedule:
    - cron: '30 19 * * *'   # 19:30 UTC = 01:00 IST daily
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install puppeteer
        run: npm install puppeteer --no-save

      - name: Headless smoke test (repo code)
        id: smoke
        run: |
          set +e
          OUT=$(node deck/smoke.js 2>&1)
          CODE=$?
          echo "$OUT"
          echo "result<<EOF" >> "$GITHUB_OUTPUT"
          echo "$OUT" | tail -40 >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          # Fail if exit non-zero, page errors present, or homepage hidden
          if [ $CODE -ne 0 ] || echo "$OUT" | grep -q '"homeVisible": false' || echo "$OUT" | grep -qE '"pageErrors": \[\s*"'; then
            echo "status=fail" >> "$GITHUB_OUTPUT"
          else
            echo "status=pass" >> "$GITHUB_OUTPUT"
          fi

      # Probes the APEX. www.regenesisimpact.in has no DNS record, so every
      # www probe returned 000 — a connection failure being read as a site
      # outage. The site is served from the apex; do not reintroduce www
      # here unless a CNAME is added for it.
      - name: Probe live site
        id: live
        run: |
          set +e
          FAILS=""
          for URL in "https://regenesisimpact.in/" "https://regenesisimpact.in/og-image.png" "https://regenesisimpact.in/site.webmanifest" "https://regenesisimpact.in/knowledge/kb.json" "https://regenesisimpact.in/knowledge/factors.json"; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 -L "$URL")
            echo "$URL -> $CODE"
            if [ "$CODE" != "200" ]; then FAILS="$FAILS\n- $URL returned $CODE"; fi
          done
          # The two JSON assets are fetched at runtime by the page, so a 200 on
          # index.html alone does not prove the tools work. Assert their shape,
          # not just their availability — a 200 serving an HTML error page would
          # otherwise read as healthy.
          REG=$(curl -s --max-time 30 -L "https://regenesisimpact.in/knowledge/factors.json")
          COUNT=$(echo "$REG" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).count)}catch(e){console.log("unparseable")}})')
          echo "factor register reports $COUNT factors"
          if [ "$COUNT" = "unparseable" ] || [ -z "$COUNT" ] || [ "$COUNT" = "undefined" ]; then
            FAILS="$FAILS\n- knowledge/factors.json did not parse as a register"
          fi
          if [ -n "$FAILS" ]; then
            echo "status=fail" >> "$GITHUB_OUTPUT"
            echo "fails<<EOF" >> "$GITHUB_OUTPUT"
            echo -e "$FAILS" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            echo "status=pass" >> "$GITHUB_OUTPUT"
          fi

      - name: File issue on failure
        if: steps.smoke.outputs.status == 'fail' || steps.live.outputs.status == 'fail'
        uses: actions/github-script@v7
        with:
          script: |
            const smoke = `${{ steps.smoke.outputs.status }}`;
            const live = `${{ steps.live.outputs.status }}`;
            const smokeOut = process.env.SMOKE_RESULT || '';
            const liveFails = process.env.LIVE_FAILS || '';
            // Avoid duplicate open issues
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'auto-improve'
            });
            if (existing.data.some(i => i.title.startsWith('[health]'))) {
              core.info('Open health issue already exists — skipping.');
              return;
            }
            const body = [
              '## Nightly health check failed',
              '',
              `**Smoke test (repo):** ${smoke}`,
              `**Live site probe:** ${live}`,
              '',
              liveFails ? `### Live failures\n${liveFails}\n` : '',
              smokeOut ? `### Smoke output (tail)\n\`\`\`\n${smokeOut}\n\`\`\`` : '',
              '',
              '@claude please investigate and fix. The smoke test is `node deck/smoke.js` ',
              '(requires `npm install puppeteer`). Acceptance: homeVisible true, zero pageErrors, ',
              'all local assets return 200.'
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `[health] Nightly check failed — ${new Date().toISOString().slice(0,10)}`,
              body, labels: ['auto-improve']
            });
        env:
          SMOKE_RESULT: ${{ steps.smoke.outputs.result }}
          LIVE_FAILS: ${{ steps.live.outputs.fails }}

      # Without this the job exits 0 after filing an issue, so the run shows
      # green while the site is unreachable. Runs last so the issue is filed
      # first.
      - name: Fail the run if any check failed
        if: steps.smoke.outputs.status == 'fail' || steps.live.outputs.status == 'fail'
        run: |
          echo "smoke=${{ steps.smoke.outputs.status }}  live=${{ steps.live.outputs.status }}"
          exit 1
